name: OpenPilot
options:
  bundleIdPrefix: com.openpilot
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: X4F3CGCVYH
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  OpenPilot:
    type: application
    platform: iOS
    sources:
      - OpenPilot
    info:
      path: OpenPilot/Info.plist
      properties:
        CFBundleDisplayName: Open Pilot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Open Pilot usa la cámara para adjuntar fotos a tus mensajes.
        NSPhotoLibraryAddUsageDescription: Open Pilot guarda las imágenes generadas en tu fototeca.
        NSPhotoLibraryUsageDescription: Open Pilot accede a tus fotos para adjuntarlas al chat.
        NSMicrophoneUsageDescription: Open Pilot usa el micrófono para dictar tus mensajes por voz.
        NSSpeechRecognitionUsageDescription: Open Pilot convierte tu voz en texto para escribir en el chat.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openpilot.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  OpenPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenPilotTests
    dependencies:
      - target: OpenPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openpilot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenPilot:
    build:
      targets:
        OpenPilot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenPilotTests
    archive:
      config: Release