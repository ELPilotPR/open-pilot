name: OpenPilot
options:
  bundleIdPrefix: com.openpilot
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    branch: main
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: X4F3CGCVYH
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  OpenPilot:
    type: application
    platform: iOS
    sources:
      - OpenPilot
    dependencies:
      - package: SwiftMath
      - target: OpenPilotShare
    entitlements:
      path: OpenPilot/OpenPilot.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openpilot.app
    info:
      path: OpenPilot/Info.plist
      properties:
        CFBundleDisplayName: Open Pilot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.openpilot.app
            CFBundleURLSchemes:
              - openpilot
        NSUserActivityTypes:
          - com.openpilot.app.chat
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: Open Pilot usa la cámara para adjuntar fotos a tus mensajes.
        NSPhotoLibraryAddUsageDescription: Open Pilot guarda las imágenes generadas en tu fototeca.
        NSPhotoLibraryUsageDescription: Open Pilot accede a tus fotos para adjuntarlas al chat.
        NSMicrophoneUsageDescription: Open Pilot usa el micrófono para dictar tus mensajes por voz.
        NSSpeechRecognitionUsageDescription: Open Pilot convierte tu voz en texto para escribir en el chat.
        NSLocalNetworkUsageDescription: Open Pilot busca servidores Ollama y LM Studio en tu red Wi-Fi para conectar tus modelos locales. Nada sale de tu red.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openpilot.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  OpenPilotShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: OpenPilot/Services/ShareInbox.swift
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.openpilot.app
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Open Pilot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationSupportsText: true
            NSExtensionActivationSupportsWebURLWithMaxCount: 1
            NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openpilot.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  OpenPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OpenPilotTests
    dependencies:
      - target: OpenPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openpilot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OpenPilot:
    build:
      targets:
        OpenPilot: all
        OpenPilotShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenPilotTests
    archive:
      config: Release